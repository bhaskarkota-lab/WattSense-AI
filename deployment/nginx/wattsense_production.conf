# ==============================================================================
# WattSense AI™ — Production Reverse Proxy & TLS Configuration (Nginx)
# ==============================================================================

# Rate limiting zone: 20 requests per second per IP with burst capacity
limit_req_zone $binary_remote_addr zone=wattsense_limit:10m rate=20r/s;

# Upstream application cluster (Docker Compose app service or internal VIP)
upstream wattsense_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP to HTTPS automatic redirection
server {
    listen 80;
    listen [::]:80;
    server_name utility.wattsense.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name utility.wattsense.ai;

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate /etc/letsencrypt/live/utility.wattsense.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utility.wattsense.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/utility.wattsense.ai/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS: 1 year, includes subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers at Reverse Proxy Perimeter
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # DoS & Payload Size Limit (Must match FastAPI MAX_REQUEST_SIZE_BYTES = 5 MB)
    client_max_body_size 5M;
    client_body_buffer_size 128k;

    # Static Assets Fast Caching & Compression
    location /assets/ {
        proxy_pass http://wattsense_backend/assets/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Public Health Probe (Bypasses rate limiting for infrastructure monitoring)
    location = /health {
        proxy_pass http://wattsense_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Application Gateway & API Reverse Proxy
    location / {
        limit_req zone=wattsense_limit burst=30 nodelay;

        proxy_pass http://wattsense_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
